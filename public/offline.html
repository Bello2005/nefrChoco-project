<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sin conexión · IPS NefroChocó</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: hsl(40 30% 98%);
                --fg: hsl(196 28% 12%);
                --muted: hsl(199 14% 44%);
                --primary: hsl(182 62% 26%);
                --card: hsl(0 0% 100%);
                --border: hsl(195 22% 90%);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: hsl(200 24% 8%);
                    --fg: hsl(185 20% 95%);
                    --muted: hsl(195 12% 62%);
                    --primary: hsl(172 62% 44%);
                    --card: hsl(199 22% 11%);
                    --border: hsl(198 16% 20%);
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--bg);
                color: var(--fg);
                font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .card {
                width: 100%;
                max-width: 26rem;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 32px;
                text-align: center;
                box-shadow: 0 12px 28px -6px hsl(195 30% 12% / 0.1);
            }

            .badge {
                display: inline-flex;
                width: 56px;
                height: 56px;
                align-items: center;
                justify-content: center;
                border-radius: 16px;
                background: var(--primary);
                color: var(--bg);
                margin-bottom: 20px;
            }

            h1 {
                margin: 0 0 10px;
                font-size: 1.35rem;
                letter-spacing: -0.02em;
            }

            p {
                margin: 0;
                color: var(--muted);
                font-size: 0.9rem;
                line-height: 1.6;
            }

            button {
                margin-top: 24px;
                width: 100%;
                padding: 12px 16px;
                border: 0;
                border-radius: 10px;
                background: var(--primary);
                color: var(--bg);
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <span class="badge">
                <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M10.6 16.8h2.6l1.5-3.4 2.1 6 1.6-2.6h2.9" />
                    <path d="M16 3.2c4.9 4.6 8.4 8.7 8.4 13.1A8.4 8.4 0 0 1 16 24.7a8.4 8.4 0 0 1-8.4-8.4c0-4.4 3.5-8.5 8.4-13.1Z" stroke-linejoin="round" />
                </svg>
            </span>

            <h1>Sin conexión</h1>
            <p>
                No pudimos cargar esta página porque no hay internet en este momento. Las mediciones que registres quedan guardadas en el
                dispositivo y se envían solas cuando vuelva la señal.
            </p>

            <button type="button" onclick="location.reload()">Reintentar</button>
        </main>
    </body>
</html>
